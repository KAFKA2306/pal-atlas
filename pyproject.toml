[project]
name = "pal-atlas-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2,<3",
]

[dependency-groups]
dev = [
  "playwright>=1,<2",
  "prek>=0.4.11",
  "pyrefly>=1.1.1",
  "pytest>=8,<9",
  "ruff>=0.15.5",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["data", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyrefly]
project-includes = ["scripts/*.py", "tests/*.py"]
project-excludes = ["data", "dist", ".venv"]
search-path = [".", "scripts"]
python-version = "3.12"
preset = "strict"
