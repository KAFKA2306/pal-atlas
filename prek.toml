[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "javascript-quality"
name = "Biome and Oxlint changed-file gate"
language = "system"
entry = "npm run quality:changed"
files = "\\.(js|jsx|mjs|cjs)$"
pass_filenames = false

[[repos.hooks]]
id = "ruff-format"
name = "Ruff format check"
language = "system"
entry = "uv run --no-sync ruff format --check scripts tests"
files = "\\.py$"
pass_filenames = false

[[repos.hooks]]
id = "ruff-lint"
name = "Ruff lint"
language = "system"
entry = "uv run --no-sync ruff check scripts tests"
files = "\\.py$"
pass_filenames = false

[[repos.hooks]]
id = "pyrefly"
name = "Pyrefly strict check"
language = "system"
entry = "uv run --no-sync pyrefly check"
files = "\\.py$"
pass_filenames = false
