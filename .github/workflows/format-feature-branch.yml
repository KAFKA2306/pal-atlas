name: Format feature branch

on:
  push:
    branches: [fix/optional-wiki-icons]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome check --write scripts/fetch-palworld-data.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet -- scripts/fetch-palworld-data.mjs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/fetch-palworld-data.mjs
          git commit -m "style: format Palworld data fetcher"
          git push
