name: Bootstrap Quality Tooling

on:
  push:
    branches: ["chore/quality-gates-2026"]
    paths:
      - ".github/workflows/bootstrap-quality-tooling.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Refresh locks and install full project quality environment
        run: |
          npm ci
          uv lock
          uv sync --locked
      - name: Remove baseline and annotate JSON helper returns
        shell: python
        run: |
          from pathlib import Path

          baseline = Path('.pyrefly-baseline.json')
          if baseline.exists():
              baseline.unlink()

          path = Path('tests/test_pal_mcp_contract.py')
          text = path.read_text(encoding='utf-8')
          if 'from typing import Any\n' not in text:
              text = text.replace('from pathlib import Path\n', 'from pathlib import Path\nfrom typing import Any\n')
          text = text.replace('def load_data(name: str) -> dict:', 'def load_data(name: str) -> dict[str, Any]:')
          text = text.replace('def load_public(name: str) -> dict:', 'def load_public(name: str) -> dict[str, Any]:')
          path.write_text(text, encoding='utf-8')
      - name: Normalize Python sources
        run: |
          uv run --no-sync ruff check --fix scripts tests || true
          uv run --no-sync ruff format scripts tests
          uv run --no-sync ruff check scripts tests
      - name: Verify Python clean gate
        run: |
          uv run --no-sync ruff format --check scripts tests
          uv run --no-sync ruff check scripts tests
          uv run --no-sync pyrefly check
          uv run --no-sync pytest -q tests/test_pal_mcp_contract.py
      - name: Verify existing JavaScript contracts
        run: |
          npm run verify:ratchet
          npm run test:embed
      - name: Commit deterministic normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock scripts/*.py tests/*.py
          git add -u .pyrefly-baseline.json || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "tooling: normalize Python quality gate"
          git pull --rebase origin chore/quality-gates-2026
          git push origin HEAD:chore/quality-gates-2026
