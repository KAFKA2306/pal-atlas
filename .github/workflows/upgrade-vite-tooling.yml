name: Upgrade Vite Tooling

on:
  push:
    branches: ["chore/quality-gates-2026"]
    paths:
      - ".github/workflows/upgrade-vite-tooling.yml"
      - "scripts/quality-changed.mjs"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Vite and refresh npm lock
        run: npm install --save-dev --save-exact vite@8.2.0
      - name: Verify npm audit
        run: npm audit --audit-level=high
      - name: Verify JavaScript tooling and production build
        run: |
          npm run quality:changed
          npm run data
          npm run verify:data
          npm run build
      - name: Commit lock refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "tooling: upgrade Vite to 8.2.0"
          git pull --rebase origin chore/quality-gates-2026
          git push origin HEAD:chore/quality-gates-2026
