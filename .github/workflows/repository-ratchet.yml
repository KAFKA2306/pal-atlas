name: Repository Ratchet

on:
  pull_request:
    paths:
      - README.md
      - docs/**
      - scripts/**
      - src/**
      - public/**
      - ontology/**
      - package.json
      - .github/workflows/**
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify canonical repository flow
        run: npm run verify:ratchet
      - name: Verify checkout clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
