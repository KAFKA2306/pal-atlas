name: Quality Gates

on:
  pull_request:
    paths:
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.py"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "uv.lock"
      - "biome.json"
      - "prek.toml"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Locked quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install locked dependencies
        run: |
          npm ci
          uv lock --check
          uv sync --locked
      - name: Apply canonical formatter once
        if: github.event_name == 'pull_request'
        run: |
          npx biome check --write --config-path=biome.json src/main.js
          if ! git diff --quiet -- src/main.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.js
            git commit -m "Format main UI with canonical Biome"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Run canonical repository check
        run: npm run check
